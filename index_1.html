<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍱 오늘 점심 뭐 먹지?</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@300;400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FFF8F0;
    --card: #FFFFFF;
    --accent: #FF6B35;
    --accent2: #FFB347;
    --dark: #1A1A2E;
    --muted: #8A8A9A;
    --border: #F0EBE3;
    --success: #2ECC71;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; }
  .app { max-width: 480px; margin: 0 auto; padding: 24px 16px 80px; }

  .header { text-align: center; padding: 28px 0 20px; }
  .header-emoji { font-size: 48px; display: block; margin-bottom: 8px; }
  .header h1 { font-family: 'Gmarket Sans', sans-serif; font-size: 26px; font-weight: 700; color: var(--dark); letter-spacing: -0.5px; }
  .header p { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.6; }

  .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 99px; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 20px; }
  .status-open { background: #E8FBF0; color: #1A8A4A; }
  .status-closed { background: #FFE8E8; color: #CC2222; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; }
  .status-open .status-dot { background: var(--success); animation: blink 1.2s infinite; }
  .status-closed .status-dot { background: #CC2222; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .card { background: var(--card); border-radius: var(--radius); border: 1.5px solid var(--border); padding: 20px; margin-bottom: 16px; }
  .card-title { font-family: 'Gmarket Sans', sans-serif; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 14px; }

  .menu-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--border); margin-bottom: 8px; cursor: pointer; background: #FAFAFA; position: relative; overflow: hidden; transition: border-color 0.15s, transform 0.1s; }
  .menu-item:not(.disabled):hover { border-color: var(--accent); transform: translateX(2px); }
  .menu-item.selected { border-color: var(--accent); background: #FFF3EE; }
  .menu-item.selected::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); border-radius: 2px 0 0 2px; }
  .menu-item.disabled { cursor: default; opacity: 0.7; }
  .menu-item-name { flex: 1; font-size: 15px; font-weight: 500; }
  .menu-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; color: transparent; transition: all 0.15s; flex-shrink: 0; }
  .menu-item.selected .menu-check { background: var(--accent); border-color: var(--accent); color: white; }

  .add-row { display: flex; gap: 8px; }
  .add-row input { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: #FAFAFA; font-size: 15px; font-family: inherit; outline: none; color: var(--dark); transition: border-color 0.15s; }
  .add-row input:focus { border-color: var(--accent); background: white; }
  .add-row button { padding: 12px 18px; border-radius: 12px; background: var(--accent); color: white; border: none; font-size: 22px; cursor: pointer; font-weight: 700; transition: transform 0.1s, opacity 0.15s; }
  .add-row button:hover { opacity: 0.88; }
  .add-row button:active { transform: scale(0.95); }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px; border-radius: var(--radius); font-size: 15px; font-weight: 700; font-family: 'Gmarket Sans', sans-serif; border: none; cursor: pointer; transition: transform 0.1s, opacity 0.15s; }
  .btn:active { transform: scale(0.97); }
  .btn-orange { background: var(--accent); color: white; }
  .btn-orange:hover { opacity: 0.9; }
  .btn-kakao { background: #FEE500; color: #191919; }
  .btn-kakao:hover { opacity: 0.9; }
  .btn-outline { background: white; color: var(--dark); border: 1.5px solid var(--border); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: white; color: #CC2222; border: 1.5px solid #FFCCCC; }
  .btn-danger:hover { background: #FFF0F0; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn + .btn { margin-top: 10px; }

  .sel-counter { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .sel-counter span { font-weight: 700; color: var(--accent); font-size: 15px; }

  .winner-card { background: linear-gradient(135deg, #FF6B35 0%, #FFB347 100%); border-radius: var(--radius); padding: 28px; text-align: center; color: white; margin-bottom: 16px; }
  .winner-emoji { font-size: 44px; display: block; margin-bottom: 8px; }
  .winner-label { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; opacity: 0.85; text-transform: uppercase; }
  .winner-name { font-family: 'Gmarket Sans', sans-serif; font-size: 34px; font-weight: 700; margin: 8px 0 6px; letter-spacing: -0.5px; }
  .winner-votes { font-size: 14px; opacity: 0.85; }

  .tabs { display: flex; background: #F0EBE3; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
  .tab { flex: 1; padding: 10px; text-align: center; border-radius: 9px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s; color: var(--muted); font-family: 'Gmarket Sans', sans-serif; }
  .tab.active { background: white; color: var(--dark); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--dark); color: white; padding: 12px 20px; border-radius: 99px; font-size: 14px; font-weight: 500; transition: transform 0.3s ease; z-index: 1000; white-space: nowrap; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .voted-banner { background: #E8FBF0; border: 1.5px solid #A8E6C3; border-radius: var(--radius); padding: 14px 18px; text-align: center; margin-bottom: 16px; font-size: 14px; color: #1A8A4A; font-weight: 500; }

  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .section-title { font-family: 'Gmarket Sans', sans-serif; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .count-badge { background: var(--accent); color: white; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .empty-state { text-align: center; padding: 28px; color: var(--muted); font-size: 14px; }
  .empty-icon { font-size: 32px; display: block; margin-bottom: 8px; }

  .progress-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .progress-row:last-child { border-bottom: none; }
  .vote-rank { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .rank-1 { background: #FFE566; color: #7A5C00; }
  .rank-2 { background: #E8E8E8; color: #555; }
  .rank-3 { background: #FFDAB9; color: #7A4000; }
  .rank-other { background: #F0F0F0; color: #888; }
  .progress-name { font-size: 14px; font-weight: 500; flex: 1; }
  .progress-bar-wrap { width: 90px; height: 8px; background: #F0EBE3; border-radius: 99px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width 0.5s ease; }
  .progress-count { font-size: 13px; font-weight: 700; color: var(--accent); min-width: 28px; text-align: right; }

  /* Firebase setup screen */
  .setup-screen { padding: 16px 0; }
  .setup-screen h2 { font-family: 'Gmarket Sans', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .setup-screen p { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 16px; }
  .step { display: flex; gap: 12px; margin-bottom: 14px; align-items: flex-start; }
  .step-num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: white; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .step-text { font-size: 14px; line-height: 1.7; color: var(--dark); }
  .step-text a { color: var(--accent); }
  .step-text code { background: #F0EBE3; padding: 2px 6px; border-radius: 6px; font-size: 13px; }
  .config-input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: #FAFAFA; font-size: 14px; font-family: 'Courier New', monospace; outline: none; color: var(--dark); margin-bottom: 10px; resize: vertical; min-height: 130px; }
  .config-input:focus { border-color: var(--accent); background: white; }

  /* Landing */
  .landing-card { text-align: center; padding: 32px 20px; }
  .landing-card p { font-size: 15px; color: var(--muted); margin-bottom: 24px; line-height: 1.8; }
  .feature-list { text-align: left; background: #FFF8F0; border-radius: 12px; padding: 16px 18px; margin-bottom: 24px; }
  .feature-list li { font-size: 14px; color: var(--dark); margin-bottom: 8px; list-style: none; padding-left: 4px; }
  .feature-list li::before { content: ''; margin-right: 8px; }

  .loading { text-align: center; padding: 60px 0; color: var(--muted); font-size: 15px; }
  .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading"><div class="spinner"></div><br>불러오는 중...</div>
</div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
//  ★ 여기에 Firebase 설정을 붙여넣으세요 ★
//  (아래 주석 처리된 예시를 본인 설정으로 교체)
// ============================================================


const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDpacU_1K6Wr7jrFlC3SAhae4N1v2UE838",
    authDomain: "lunch-vote-30a1c.firebaseapp.com",
    databaseURL: "https://lunch-vote-30a1c-default-rtdb.firebaseio.com",
    projectId: "lunch-vote-30a1c",
    storageBucket: "lunch-vote-30a1c.firebasestorage.app",
    messagingSenderId: "937656677664",
    appId: "1:937656677664:web:8250fbdfe12f01a4c29345"
  };





// const FIREBASE_CONFIG = {
//   apiKey: "AIzaSy...",
//   authDomain: "your-project.firebaseapp.com",
//   databaseURL: "https://your-project-default-rtdb.firebaseio.com",
//   projectId: "your-project",
//   storageBucket: "your-project.appspot.com",
//   messagingSenderId: "123456789",
//   appId: "1:123..."
// };
// ============================================================

const DEFAULT_MENUS = ['중국집(아방궁)', '순대국(농민백암)', '국밥(1층)', '돈까스(청담돈까스)'];

// Voter ID (anonymous, stored in localStorage)
function getVoterId() {
  let id = localStorage.getItem('lunch_voter_id');
  if (!id) { id = 'v_' + Math.random().toString(36).substr(2, 9); localStorage.setItem('lunch_voter_id', id); }
  return id;
}
const MY_ID = getVoterId();

function getRoomId() { return new URLSearchParams(window.location.search).get('room'); }
function getRoomUrl(roomId) { return window.location.origin + window.location.pathname + '?room=' + roomId; }

// ── State ──
let db = null;
let roomRef = null;
let state = null;
let selected = [];
let activeView = 'vote';
let hasVoted = false;

// ── Firebase init ──
function initFirebase(config) {
  if (!firebase.apps.length) firebase.initializeApp(config);
  db = firebase.database();
}

async function init() {
  // Check config
  if (!FIREBASE_CONFIG) { showSetupScreen(); return; }
  try { initFirebase(FIREBASE_CONFIG); } catch(e) { showSetupScreen(); return; }

  const roomId = getRoomId();
  if (!roomId) { showLanding(); return; }

  showLoading();
  roomRef = db.ref('rooms/' + roomId);
  const snap = await roomRef.once('value');
  if (!snap.exists()) { showError('방을 찾을 수 없어요. 링크를 다시 확인해주세요.'); return; }

  // Listen for real-time updates
  roomRef.on('value', snap => {
    if (!snap.exists()) return;
    state = snap.val();
    state.menus = state.menus || [];
    state.votes = state.votes || {};
    hasVoted = !!state.votes[MY_ID];
    if (hasVoted) selected = state.votes[MY_ID] || [];
    if (hasVoted && activeView === 'vote') activeView = 'results';
    render();
  });
}

async function createRoom() {
  const roomId = Math.random().toString(36).substr(2, 8).toUpperCase();
  // 저장된 마스터 메뉴 불러오기 (없으면 DEFAULT_MENUS 사용)
  const masterSnap = await db.ref('masterMenus').once('value');
  const menus = masterSnap.exists() ? masterSnap.val() : DEFAULT_MENUS;
  const newState = {
    roomId,
    hostId: MY_ID,
    menus,
    votes: {},
    closed: false,
    createdAt: Date.now(),
  };
  await db.ref('rooms/' + roomId).set(newState);
  const url = new URL(window.location.href);
  url.searchParams.set('room', roomId);
  window.history.pushState({}, '', url);
  roomRef = db.ref('rooms/' + roomId);
  roomRef.on('value', snap => {
    if (!snap.exists()) return;
    state = snap.val();
    state.menus = state.menus || [];
    state.votes = state.votes || {};
    hasVoted = !!state.votes[MY_ID];
    if (hasVoted) selected = state.votes[MY_ID] || [];
    render();
  });
}

// ── Renders ──
function showLoading() {
  document.getElementById('app').innerHTML = `<div class="loading"><div class="spinner"></div><br>불러오는 중...</div>`;
}
function showError(msg) {
  document.getElementById('app').innerHTML = `<div class="empty-state"><span class="empty-icon">😢</span>${msg}</div>`;
}

function showSetupScreen() {
  document.getElementById('app').innerHTML = `
    <div class="header">
      <span class="header-emoji">🍱</span>
      <h1>오늘 점심 뭐 먹지?</h1>
      <p>온라인 공유를 위해 Firebase 설정이 필요해요<br>(무료, 5분 소요)</p>
    </div>
    <div class="card setup-screen">
      <h2>⚙️ Firebase 설정하기</h2>
      <p>아래 단계를 따라 무료 데이터베이스를 연결하면<br>카카오톡으로 공유해서 실시간 투표가 가능해요!</p>
      <div class="step"><div class="step-num">1</div><div class="step-text"><a href="https://console.firebase.google.com" target="_blank">console.firebase.google.com</a> 접속 → 구글 로그인 → <strong>"프로젝트 만들기"</strong></div></div>
      <div class="step"><div class="step-num">2</div><div class="step-text">프로젝트 이름 입력 (예: lunch-vote) → 계속 → 프로젝트 만들기</div></div>
      <div class="step"><div class="step-num">3</div><div class="step-text">왼쪽 메뉴 <strong>"빌드" → "Realtime Database"</strong> → 데이터베이스 만들기 → <strong>테스트 모드</strong>로 시작</div></div>
      <div class="step"><div class="step-num">4</div><div class="step-text">왼쪽 톱니바퀴 → <strong>"프로젝트 설정"</strong> → 스크롤 내려서 <strong>"웹 앱 추가"</strong> → 앱 이름 입력 → <strong>firebaseConfig 코드 복사</strong></div></div>
      <div class="step"><div class="step-num">5</div><div class="step-text">이 파일(index.html)을 열어서 상단의 <code>FIREBASE_CONFIG = null</code> 부분을 복사한 설정으로 교체 후 저장</div></div>
    </div>
    <div class="card">
      <div class="card-title">💡 도움이 필요하면</div>
      <p style="font-size:14px;color:var(--muted);line-height:1.8">Firebase 설정이 어렵다면 Claude에게 "Firebase 설정 도와줘"라고 말씀해 주세요. 단계별로 안내해 드려요!</p>
    </div>
  `;
}

function showLanding() {
  document.getElementById('app').innerHTML = `
    <div class="header">
      <span class="header-emoji">🍱</span>
      <h1>오늘 점심 뭐 먹지?</h1>
      <p>팀원들과 함께 투표로 점심 메뉴를 골라보세요</p>
    </div>
    <div class="card landing-card">
      <ul class="feature-list">
        <li>🔗 카카오톡으로 링크 공유</li>
        <li>🗳️ 각자 메뉴 3개 익명 투표</li>
        <li>📊 실시간 결과 확인</li>
        <li>➕ 누구나 메뉴 추가 가능</li>
        <li>🔒 주최자가 투표 마감</li>
      </ul>
      <button class="btn btn-orange" onclick="startRoom()">🎉 투표 방 만들기</button>
    </div>
  `;
}

async function startRoom() {
  const btn = document.querySelector('.btn-orange');
  if (btn) { btn.disabled = true; btn.textContent = '만드는 중...'; }
  await createRoom();
  hasVoted = false; selected = []; activeView = 'vote';
}

function getTotalVoters() { return Object.keys(state.votes || {}).length; }
function getVoteCounts() {
  const counts = {};
  (state.menus || []).forEach(m => counts[m] = 0);
  Object.values(state.votes || {}).forEach(picks => (picks || []).forEach(p => { if (counts[p] !== undefined) counts[p]++; }));
  return counts;
}
function getWinner() {
  const c = getVoteCounts();
  const sorted = Object.entries(c).sort((a, b) => b[1] - a[1]);
  return sorted[0] && sorted[0][1] > 0 ? sorted[0][0] : null;
}

function render() {
  const app = document.getElementById('app');
  const total = getTotalVoters();
  const counts = getVoteCounts();
  const maxVotes = Math.max(...Object.values(counts), 1);
  const winner = getWinner();
  const isHost = state.hostId === MY_ID;

  let html = `
    <div class="header">
      <span class="header-emoji">🍱</span>
      <h1>오늘 점심 뭐 먹지?</h1>
      <p>방 코드: <strong style="color:var(--accent)">${state.roomId}</strong> &nbsp;·&nbsp; 참여자 <strong>${total}</strong>명</p>
    </div>
    <div style="text-align:center; margin-bottom:16px;">
      <span class="status-badge ${state.closed ? 'status-closed' : 'status-open'}">
        <span class="status-dot"></span>${state.closed ? '투표 마감됨' : '투표 진행 중'}
      </span>
    </div>
    <div class="tabs">
      <div class="tab ${activeView === 'vote' ? 'active' : ''}" onclick="setView('vote')">🗳️ 투표하기</div>
      <div class="tab ${activeView === 'results' ? 'active' : ''}" onclick="setView('results')">📊 결과 보기</div>
    </div>
  `;

  if (activeView === 'vote') {
    if (hasVoted) {
      html += `<div class="voted-banner">✅ 투표 완료! 결과는 [결과 보기] 탭에서 확인하세요.</div>`;
    } else if (!state.closed) {
      html += `<div class="sel-counter">메뉴를 <span>${selected.length}</span>/3개 선택했어요</div>`;
    }

    html += `<div class="card">`;
    html += `<div class="section-header"><span class="section-title">📋 메뉴 목록</span><span class="count-badge">${(state.menus || []).length}개</span></div>`;
    if ((state.menus || []).length === 0) {
      html += `<div class="empty-state"><span class="empty-icon">🍽️</span>아직 메뉴가 없어요!</div>`;
    } else {
      (state.menus || []).forEach(name => {
        const isSel = selected.includes(name);
        const disabled = state.closed || hasVoted;
        html += `<div class="menu-item ${isSel ? 'selected' : ''} ${disabled ? 'disabled' : ''}" onclick="${disabled ? '' : `toggleMenu('${name.replace(/'/g, "\\'")}')` }">
          <div class="menu-check">${isSel ? '✓' : ''}</div>
          <span class="menu-item-name">${name}</span>
        </div>`;
      });
    }
    html += `</div>`;

    if (!state.closed) {
      html += `<div class="card">
        <div class="card-title">➕ 메뉴 추가 (누구나 가능)</div>
        <div class="add-row">
          <input type="text" id="newMenuInput" placeholder="메뉴 이름 입력..." maxlength="20" onkeydown="if(event.key==='Enter')addMenu()" />
          <button onclick="addMenu()">+</button>
        </div>
      </div>`;
    }

    if (!state.closed && !hasVoted) {
      html += `<button class="btn btn-orange" onclick="submitVote()" ${selected.length !== 3 ? 'disabled' : ''}>
        ${selected.length === 3 ? '✅ 투표 완료!' : `메뉴 3개를 선택해주세요 (${3 - selected.length}개 남음)`}
      </button>`;
    }

  } else {
    // Results
    if (state.closed && winner) {
      html += `<div class="winner-card">
        <span class="winner-emoji">🏆</span>
        <div class="winner-label">오늘의 메뉴</div>
        <div class="winner-name">${winner}</div>
        <div class="winner-votes">${counts[winner]}표 획득</div>
      </div>`;
    } else if (!state.closed) {
      html += `<div style="text-align:center;color:var(--muted);font-size:14px;margin-bottom:16px">투표가 마감되면 최종 결과를 볼 수 있어요</div>`;
    }

    html += `<div class="card">`;
    html += `<div class="section-header"><span class="section-title">📊 현재 투표 현황</span><span style="font-size:13px;color:var(--muted)">${total}명 참여</span></div>`;
    if (total === 0) {
      html += `<div class="empty-state"><span class="empty-icon">⏳</span>아직 투표한 사람이 없어요</div>`;
    } else {
      const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      sorted.forEach(([name, cnt], i) => {
        const pct = maxVotes > 0 ? (cnt / maxVotes) * 100 : 0;
        const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : 'rank-other';
        html += `<div class="progress-row">
          <div class="vote-rank ${rankClass}">${i + 1}</div>
          <span class="progress-name">${name}</span>
          <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
          <span class="progress-count">${cnt}표</span>
        </div>`;
      });
    }
    html += `</div>`;
  }

  // Host controls
  if (isHost) {
    html += `<div class="card">
      <div class="card-title">⚙️ 주최자 메뉴</div>
      ${!state.closed
        ? `<button class="btn btn-danger" onclick="closeVote()">🔒 투표 마감하기</button>`
        : `<button class="btn btn-outline" onclick="reopenVote()">🔓 투표 다시 열기</button>`
      }
    </div>`;
  }

  // Share
  html += `<div class="card">
    <div class="card-title">📤 공유하기</div>
    <button class="btn btn-kakao" onclick="shareKakao()" style="margin-bottom:10px">
      <svg width="20" height="18" viewBox="0 0 20 18" fill="none"><ellipse cx="10" cy="8.5" rx="9.5" ry="7.5" fill="#191919"/><path d="M6.5 11.5L8 8l2 3 2-3 1.5 3.5" stroke="#FEE500" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      카카오톡으로 공유
    </button>
    <button class="btn btn-outline" onclick="copyLink()">🔗 링크 복사</button>
  </div>`;

  app.innerHTML = html;
}

function setView(v) { activeView = v; render(); }

function toggleMenu(name) {
  if (state.closed || hasVoted) return;
  if (selected.includes(name)) {
    selected = selected.filter(s => s !== name);
  } else {
    if (selected.length >= 3) { showToast('최대 3개까지 선택할 수 있어요!'); return; }
    selected.push(name);
  }
  render();
}

async function addMenu() {
  const inp = document.getElementById('newMenuInput');
  if (!inp) return;
  const name = inp.value.trim();
  if (!name) { showToast('메뉴 이름을 입력해주세요'); inp.focus(); return; }
  if ((state.menus || []).includes(name)) { showToast('이미 있는 메뉴예요!'); return; }
  // 현재 방 메뉴에 추가
  await roomRef.child('menus').transaction(menus => [...(menus || []), name]);
  // 마스터 메뉴에도 저장 (다음 방 만들 때 반영)
  await db.ref('masterMenus').transaction(menus => {
    const list = menus || [...DEFAULT_MENUS];
    if (!list.includes(name)) list.push(name);
    return list;
  });
  showToast('✅ ' + name + ' 추가됨!');
}

async function submitVote() {
  if (selected.length !== 3 || hasVoted || state.closed) return;
  await roomRef.child('votes/' + MY_ID).set([...selected]);
  hasVoted = true;
  showToast('🎉 투표 완료!');
  activeView = 'results';
}

async function closeVote() {
  await roomRef.child('closed').set(true);
  showToast('🔒 투표가 마감됐어요');
  activeView = 'results';
}

async function reopenVote() {
  await roomRef.child('closed').set(false);
  showToast('🔓 투표가 다시 열렸어요');
}

function copyLink() {
  const url = getRoomUrl(state.roomId);
  navigator.clipboard.writeText(url).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  });
  showToast('🔗 링크가 복사됐어요!');
}

function shareKakao() {
  copyLink();
  showToast('링크 복사됨! 카카오톡에 붙여넣기 해주세요 💬');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

init();
</script>
</body>
</html>
